<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 荒野南二團 蜂蟻出席狀況查詢 🐜</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f7ff 0%, #e6f2ff 100%);
      color: #2c3e50;
      padding: 30px 15px;
      margin: 0;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 25px;
      color: #2c3e50;
      font-weight: 700;
    }
    .card {
      background-color: #ffffff;
      max-width: 520px;
      margin: 0 auto 25px;
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: left;
    }
    .card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
    }
    .card select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1.5px solid #cbd5e0;
      border-radius: 10px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }
    .card select:focus {
      border-color: #3182ce;
    }
    .card button {
      display: block;
      width: 100%;
      padding: 12px 0;
      margin-top: 15px;
      font-size: 1.05em;
      font-weight: 600;
      color: white;
      background-color: #3182ce;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .card button:hover {
      background-color: #2b6cb0;
    }
    ul#results { list-style: none; padding: 0; margin: 0; }
    ul#results li {
      padding: 10px 14px;
      margin: 8px auto;
      max-width: 520px;
      border-radius: 10px;
      background-color: #ffffff;
      border-left: 5px solid #cbd5e0;
      text-align: left;
      font-size: 1em;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .event-header {
      background: #ebf8ff !important;
      border-left-color: #3182ce !important;
      color: #2b6cb0;
      font-size: 1.1em;
      margin-top: 20px !important;
    }
    .team-header {
      background: #f7fafc !important;
      border-left-color: #a0aec0 !important;
      color: #4a5568;
    }
    .status-present { color: #38a169; font-weight: bold; }
    .status-absent  { color: #e53e3e; font-weight: bold; }
    .status-unfilled { color: #a0aec0; font-style: italic; }
  </style>
</head>
<body>
  <h1>
    <a href="https://sowtnn02.github.io/home/index" style="text-decoration: none; color: inherit;">
      🐝 荒野保護協會親子團南二團 蜂蟻出席狀況 🐜
    </a>
  </h1>
  <div class="card">
    <label for="groupSelect">選擇團別</label>
    <select id="groupSelect">
      <option value="">--請選擇團別--</option>
      <option value="小蟻團">🐜 小蟻團</option>
      <option value="炫蜂團">🐝 炫蜂團</option>
    </select>
    <button id="searchBtn">開始搜尋</button>
  </div>
  <ul id="results"></ul>

  <script src="https://sowtnn02.github.io/home/team-data.js"></script>

  <script>
    const MY_PROXY_URL = "https://script.google.com/macros/s/AKfycbwrJBnHnDOrNU--jaEV0FLI1x2cHW7OSjIy_oRkGu9PU66rH0ZOTEx1udJ4m3XuPWdo/exec";
    const MASTER_DB_ID = "1rsQZORmQldGeco9YRNUn9jaO10ogvXpsVSqjk4Z8Ur0"; 

    const groupMap = { '小蟻團':'ant', '炫蜂團':'bee' };
    const sheetNameMap = { "小蟻團": '蜂蟻', "炫蜂團": '蜂蟻' };

    function extractSpreadsheetId(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : "";
    }

    function toMyProxyUrl(originalUrl) {
      const targetId = extractSpreadsheetId(originalUrl);
      if (!targetId) return "";
      return `${MY_PROXY_URL}?targetId=${targetId}&sheetName=${encodeURIComponent("表單回覆 1")}`;
    }

    // 🟢 格式化月份文字（修正 ISO 長字串問題）
    function formatMonthStr(rawMonth) {
      if (!rawMonth) return '';
      const str = String(rawMonth).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          return `${year}-${month}`;
        }
      }
      return str;
    }

    async function loadSheetsFromSheet(sheetName) {
      const url = `${MY_PROXY_URL}?targetId=${MASTER_DB_ID}&sheetName=${encodeURIComponent(sheetName)}`;
      try {
        const res = await fetch(url);
        const raw = await res.json();
        if (raw.error) return [];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const validData = raw.filter(item => {
           if (item.date) {
             const startDate = new Date(item.date);
             startDate.setHours(0, 0, 0, 0);
             if (startDate > today) return false; 
           }
           if (item.expiryDate) {
             const endDate = new Date(item.expiryDate);
             endDate.setHours(0, 0, 0, 0);
             if (endDate < today) return false; 
           }
           return true;
        });

        return validData.map(item => ({
          name: `${formatMonthStr(item.month)} ${item.title || ''}`.trim(),
          url: toMyProxyUrl(item.response_url || item.form_url)
        }));
      } catch (e) {
        return [];
      }
    }

    // 清理字串，只留下自然名與中文名稱
    function cleanName(rawStr) {
      if (!rawStr) return '';
      return String(rawStr).replace(/^[0-9\s]+/, '').trim();
    }

    const groupSelect = document.getElementById('groupSelect');
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');

    searchBtn.addEventListener('click', async () => {
      results.innerHTML = '';
      
      if (typeof teamData === 'undefined') {
        alert("⚠️ 無法讀取名單資料，請檢查 team-data.js。");
        return;
      }

      const grp = groupSelect.value.trim();
      if (!grp) return alert('請選擇團別');

      const key = groupMap[grp];
      const masterSheetName = sheetNameMap[grp];

      results.innerHTML = '<li style="text-align:center; color:#718096; background:#fff;">⏳ 正在連線讀取出席資料，請稍候...</li>';

      const allSubGroups = Object.keys(teamData[key] || {});
      const sheets = await loadSheetsFromSheet(masterSheetName);

      results.innerHTML = '';

      if (sheets.length === 0) {
        results.innerHTML = '<li>⚠️ 找不到任何表單紀錄，或是目前無開放的表單。</li>';
        return;
      }

      for (const sheet of sheets) {
        if (!sheet.url || sheet.url.includes("targetId=&")) continue;

        results.innerHTML += `
          <li class="event-header">
            📅 <strong>${sheet.name}</strong> ｜ ${grp} 出席狀況
          </li>`;

        let data;
        try {
          const resp = await fetch(sheet.url + '&t=' + Date.now(), { cache:'no-store' });
          data = await resp.json();
          if (data.error) throw new Error(data.error);
        } catch {
          results.innerHTML += `<li style="border-left-color:#e53e3e;">⚠️ 查詢失敗（請檢查 GAS 部署權限設定）</li>`;
          continue;
        }

        const filledStatusMap = {};

        data.forEach(row => {
          const keys = Object.keys(row);
          const vals = Object.values(row);

          // 🟢 動態尋找包含「蜂/蟻」與「出席/參加」的對應欄位
          keys.forEach((k, idx) => {
            const keyStr = String(k);
            
            // 比對是否屬於目前選擇的團別（例如標題含有小蟻或炫蜂）
            let isTargetGroup = false;
            if (grp === '炫蜂團' && (keyStr.includes('炫蜂') || keyStr.includes('蜂'))) isTargetGroup = true;
            if (grp === '小蟻團' && (keyStr.includes('小蟻') || keyStr.includes('蟻'))) isTargetGroup = true;

            // 預備欄位索引：預設 [7,8], [9,10] 為蜂；[11,12], [13,14] 為蟻
            let colPairs = [];
            if (grp === '炫蜂團') colPairs = [[7, 8], [9, 10]];
            if (grp === '小蟻團') colPairs = [[11, 12], [13, 14]];

            colPairs.forEach(([childCol, statusCol]) => {
              const rawChild = vals[childCol] || '';
              const rawStatus = vals[statusCol] || '';
              const cleanedChild = cleanName(rawChild);

              if (cleanedChild && !cleanedChild.includes('無此成員')) {
                filledStatusMap[cleanedChild] = String(rawStatus);
              }
            });
          });
        });

        // 印出該團別專屬的小隊與成員
        for (const sub of allSubGroups) {
          const entries = teamData[key][sub] || [];
          results.innerHTML += `<li class="team-header">🟢 <strong>${sub}</strong></li>`;

          entries.forEach(e => {
            const childName = (e.child || '').trim();
            const cleanChild = cleanName(childName);
            let line = "";
            
            // 進行模糊/精準雙重比對
            let matchedKey = Object.keys(filledStatusMap).find(k => k.includes(cleanChild) || cleanChild.includes(k));

            if (matchedKey) {
              const st = filledStatusMap[matchedKey];
              const ok = st.includes('出席') || st.includes('參加') || st.includes('是');
              line = `${e.family} _ ${childName}：<span class="${ok?'status-present':'status-absent'}">${ok?'✅ 出席':'❌ 請假'}</span>`;
            } else {
              line = `${e.family} _ ${childName}：<span class="status-unfilled">未填寫</span>`;
            }
            results.innerHTML += `<li>${line}</li>`;
          });
        }
      }
    });
  </script>
</body>
</html>
