<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 南二團 各小隊出席狀況 🐜</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to bottom right, #f9f9f9, #e6f7ff);
      color: #333;
      padding: 40px 20px;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 30px;
      color: #3c6478;
    }
    .card {
      background-color: white;
      max-width: 500px;
      margin: 0 auto 20px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: left;
    }
    .card label {
      display: block;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .card select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }
    .card button {
      display: block;
      width: 100%;
      padding: 10px 0;
      margin-top: 10px;
      font-size: 1em;
      color: white;
      background-color: #47a7f5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .card button:hover {
      background-color: #358ac9;
    }
    ul#results { list-style: none; padding: 0; margin: 0; }
    ul#results li {
      padding: 8px;
      margin: 6px auto;
      max-width: 500px;
      border-radius: 8px;
      background-color: #f1f8ff;
      border-left: 6px solid #47a7f5;
      text-align: left;
      font-size: 1em;
    }
    .status-present { color: green; font-weight: bold; }
    .status-absent  { color: red; font-weight: bold; }
    .status-unfilled { color: gray; font-style: italic; }
  </style>
</head>
<body>
  <h1>
    <a href="https://sowtnn02.github.io/home/index" style="text-decoration: none; color: inherit;">
      🐝 荒野保護協會親子團南二團 各分團出席總覽 🐜
    </a>
  </h1>
  <div class="card">
    <label for="groupSelect">團別</label>
    <select id="groupSelect">
      <option value="">--請選擇團別--</option>
      <option value="小蟻團">小蟻團</option>
      <option value="炫蜂團">炫蜂團</option>
    </select>
    <button id="searchBtn">搜尋</button>
  </div>
  <ul id="results"></ul>

  <script src="https://sowtnn02.github.io/home/team-data.js"></script>

  <script>
    // 🔴 GAS 代理網址與主資料庫 ID
    const MY_PROXY_URL = "https://script.google.com/macros/s/AKfycbxmzTs-dGe8rlGjeaUJH44bravhTNccqFsfImSz_wV-bSniF-E1aOqZ6nyShvyVYAtFCQ/exec";
    const MASTER_DB_ID = "1rsQZORmQldGeco9YRNUn9jaO10ogvXpsVSqjk4Z8Ur0"; 

    const groupMap = { '小蟻團':'ant','炫蜂團':'bee','奔鹿團':'deer','翔鷹團':'eagle' };
    const sheetNameMap = { "小蟻團": '蜂蟻', "炫蜂團": '蜂蟻', "奔鹿團": '鹿', "翔鷹團": '鷹' };

    function toMyProxyUrl(originalUrl) {
      if (!originalUrl) return "";
      const match = originalUrl.match(/\/d\/(.*?)(\/|$)/);
      const targetId = match ? match[1] : "";
      if (!targetId) return "";
      return `${MY_PROXY_URL}?targetId=${targetId}&sheetName=${encodeURIComponent("表單回應 1")}`;
    }

    async function loadSheetsFromSheet(sheetName) {
      const url = `${MY_PROXY_URL}?targetId=${MASTER_DB_ID}&sheetName=${encodeURIComponent(sheetName)}`;
      try {
        const res = await fetch(url);
        const raw = await res.json();
        if (raw.error) return [];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const validData = raw.filter(item => {
           if (item.date) {
             const startDate = new Date(item.date);
             startDate.setHours(0, 0, 0, 0);
             if (startDate > today) return false; 
           }
           if (item.expiryDate) {
             const endDate = new Date(item.expiryDate);
             endDate.setHours(0, 0, 0, 0);
             if (endDate < today) return false; 
           }
           return true;
        });

        return validData.map(item => ({
          name: `${item.month || ''} ${item.title || ''}`,
          url: toMyProxyUrl(item.response_url || item.form_url)
        }));
      } catch (e) {
        return [];
      }
    }

    // 🟢 自動清理名字中的數字編號 (例如 "37 彩虹龍" -> "彩虹龍")
    function cleanName(rawStr) {
      if (!rawStr) return '';
      return rawStr.replace(/^[0-9\s]+/, '').trim();
    }

    const groupSelect = document.getElementById('groupSelect');
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');

    searchBtn.addEventListener('click', async () => {
      results.innerHTML = '';
      
      if (typeof teamData === 'undefined') {
        alert("⚠️ 無法讀取名單資料，請檢查 team-data.js。");
        return;
      }

      const grp = groupSelect.value.trim();
      if (!grp) return alert('請選擇團別');

      const key = groupMap[grp];
      const masterSheetName = sheetNameMap[grp];

      results.innerHTML = '<li style="text-align:center; color:#666;">⏳ 查詢中，請稍候...</li>';

      const allSubGroups = Object.keys(teamData[key]);
      const sheets = await loadSheetsFromSheet(masterSheetName);

      results.innerHTML = '';

      if (sheets.length === 0) {
        results.innerHTML = '<li>⚠️ 找不到任何表單紀錄，或是目前無開放的表單。</li>';
        return;
      }

      for (const sheet of sheets) {
        if (!sheet.url || sheet.url.includes("targetId=&")) continue;

        results.innerHTML += `
          <li style="background:#e0f0ff; padding:10px; border-radius:8px; font-weight:bold; color:#2a5d9f; margin-top:20px">
            ${sheet.name}｜${grp}出席狀況：
          </li>`;

        let data;
        try {
          const resp = await fetch(sheet.url + '&t=' + Date.now(), { cache:'no-store' });
          data = await resp.json();
          if (data.error) throw new Error(data.error);
        } catch {
          results.innerHTML += `<li>⚠️ 查詢失敗 (連線逾時或權限錯誤)</li>`;
          continue;
        }

        // 🟢 將表單回覆轉成對照 Map
        const filledStatusMap = {};

        data.forEach(row => {
          const vals = Object.values(row);
          
          // 炫蜂團 (蜂): 小蜂(1)在 H(7), I(8) | 小蜂(2)在 J(9), K(10)
          // 小蟻團 (蟻): 小蟻(1)在 L(11), M(12) | 小蟻(2)在 N(13), O(14)
          let colPairs = [];
          if (grp === '炫蜂團') {
            colPairs = [[7, 8], [9, 10]];
          } else if (grp === '小蟻團') {
            colPairs = [[11, 12], [13, 14]];
          }

          colPairs.forEach(([childCol, statusCol]) => {
            const rawChild = vals[childCol] || '';
            const rawStatus = vals[statusCol] || '';
            const cleanedChild = cleanName(rawChild);

            if (cleanedChild && !cleanedChild.includes('無此成員')) {
              filledStatusMap[cleanedChild] = rawStatus;
            }
          });
        });

        // 🟢 渲染各小隊成員狀態
        for (const sub of allSubGroups) {
          const entries = teamData[key][sub];
          results.innerHTML += `<li style="background:#f9fbff; font-weight:bold; margin-top:10px;">🟢 ${sub}</li>`;

          entries.forEach(e => {
            const childName = e.child.trim();
            
            if (childName in filledStatusMap) {
              const st = filledStatusMap[childName];
              const ok = st.includes('出席');
              line = `${e.family} _ ${childName}：<span class="${ok?'status-present':'status-absent'}">${ok?'✅ 出席':'❌ 請假'}</span>`;
            } else {
              line = `${e.family} _ ${childName}：<span class="status-unfilled">未填寫</span>`;
            }
            results.innerHTML += `<li>${line}</li>`;
          });
        }
      }
    });
  </script>
</body>
</html>
