<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 荒野南二團 蜂蟻出席狀況查詢 🐜</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f7ff 0%, #e6f2ff 100%);
      color: #2c3e50;
      padding: 30px 15px;
      margin: 0;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 25px;
      color: #2c3e50;
      font-weight: 700;
    }
    .card {
      background-color: #ffffff;
      max-width: 520px;
      margin: 0 auto 25px;
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: left;
    }
    .card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
    }
    .card select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1.5px solid #cbd5e0;
      border-radius: 10px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }
    .card select:focus {
      border-color: #3182ce;
    }
    .card button {
      display: block;
      width: 100%;
      padding: 12px 0;
      margin-top: 15px;
      font-size: 1.05em;
      font-weight: 600;
      color: white;
      background-color: #3182ce;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .card button:hover {
      background-color: #2b6cb0;
    }
    ul#results { list-style: none; padding: 0; margin: 0; }
    ul#results li {
      padding: 10px 14px;
      margin: 8px auto;
      max-width: 520px;
      border-radius: 10px;
      background-color: #ffffff;
      border-left: 5px solid #cbd5e0;
      text-align: left;
      font-size: 1em;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .event-header {
      background: #ebf8ff !important;
      border-left-color: #3182ce !important;
      color: #2b6cb0;
      font-size: 1.1em;
      margin-top: 20px !important;
    }
    .team-header {
      background: #f7fafc !important;
      border-left-color: #a0aec0 !important;
      color: #4a5568;
    }
    .status-present { color: #38a169; font-weight: bold; }
    .status-absent  { color: #e53e3e; font-weight: bold; }
    .status-unfilled { color: #a0aec0; font-style: italic; }
    .status-error   { color: #dd6b20; font-weight: bold; }
  </style>
</head>
<body>
  <h1>
    <a href="https://sowtnn02.github.io/home/index" style="text-decoration: none; color: inherit;">
      🐝 荒野保護協會親子團南二團 蜂蟻出席狀況 🐜
    </a>
  </h1>
  <div class="card">
    <label for="groupSelect">選擇團別</label>
    <select id="groupSelect">
      <option value="">--請選擇團別--</option>
      <option value="小蟻團">🐜 小蟻團</option>
      <option value="炫蜂團">🐝 炫蜂團</option>
    </select>
    <button id="searchBtn">開始搜尋</button>
  </div>
  <ul id="results"></ul>

  <script src="https://sowtnn02.github.io/home/team-data.js"></script>

  <script>
    const MY_PROXY_URL = "https://script.google.com/macros/s/AKfycbwrJBnHnDOrNU--jaEV0FLI1x2cHW7OSjIy_oRkGu9PU66rH0ZOTEx1udJ4m3XuPWdo/exec";
    const MASTER_DB_ID = "1rsQZORmQldGeco9YRNUn9jaO10ogvXpsVSqjk4Z8Ur0"; 

    const groupMap = { '小蟻團':'ant', '炫蜂團':'bee' };
    const sheetNameMap = { "小蟻團": '蜂蟻', "炫蜂團": '蜂蟻' };

    function extractSpreadsheetId(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : "";
    }

    function toMyProxyUrl(originalUrl) {
      const targetId = extractSpreadsheetId(originalUrl);
      if (!targetId) return "";
      return `${MY_PROXY_URL}?targetId=${targetId}&sheetName=${encodeURIComponent("表單回覆 1")}`;
    }

    function formatMonthStr(rawMonth) {
      if (!rawMonth) return '';
      const str = String(rawMonth).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          return `${year}-${month}`;
        }
      }
      return str;
    }

    async function loadSheetsFromSheet(sheetName) {
      const url = `${MY_PROXY_URL}?targetId=${MASTER_DB_ID}&sheetName=${encodeURIComponent(sheetName)}`;
      try {
        const res = await fetch(url);
        const raw = await res.json();
        if (raw.error) return [];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const validData = raw.filter(item => {
           if (item.date) {
             const startDate = new Date(item.date);
             startDate.setHours(0, 0, 0, 0);
             if (startDate > today) return false; 
           }
           if (item.expiryDate) {
             const endDate = new Date(item.expiryDate);
             endDate.setHours(0, 0, 0, 0);
             if (endDate < today) return false; 
           }
           return true;
        });

        return validData.map(item => ({
          name: `${formatMonthStr(item.month)} ${item.title || ''}`.trim(),
          url: toMyProxyUrl(item.response_url || item.form_url)
        }));
      } catch (e) {
        return [];
      }
    }

    function extractNum(rawStr) {
      if (!rawStr) return '';
      const match = String(rawStr).match(/^(\d+)/);
      return match ? match[1] : '';
    }

    function cleanName(rawStr) {
      if (!rawStr) return '';
      return String(rawStr).replace(/^[0-9\s]+/, '').trim();
    }

    const groupSelect = document.getElementById('groupSelect');
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');

    searchBtn.addEventListener('click', async () => {
      results.innerHTML = '';
      
      if (typeof teamData === 'undefined') {
        alert("⚠️ 無法讀取名單資料，請檢查 team-data.js。");
        return;
      }

      const grp = groupSelect.value.trim();
      if (!grp) return alert('請選擇團別');

      const key = groupMap[grp];
      const masterSheetName = sheetNameMap[grp];

      results.innerHTML = '<li style="text-align:center; color:#718096; background:#fff;">⏳ 正在連線讀取出席資料，請稍候...</li>';

      const subGroupObj = teamData[key] || {};
      const allSubGroups = Object.keys(subGroupObj);

      const sheets = await loadSheetsFromSheet(masterSheetName);

      results.innerHTML = '';

      if (sheets.length === 0) {
        results.innerHTML = '<li>⚠️ 找不到任何表單紀錄，或是目前無開放的表單。</li>';
        return;
      }

      for (const sheet of sheets) {
        if (!sheet.url || sheet.url.includes("targetId=&")) continue;

        results.innerHTML += `
          <li class="event-header">
            📅 <strong>${sheet.name}</strong> ｜ ${grp} 出席狀況
          </li>`;

        let data;
        try {
          const resp = await fetch(sheet.url + '&t=' + Date.now(), { cache:'no-store' });
          data = await resp.json();
          if (data.error) throw new Error(data.error);
        } catch {
          results.innerHTML += `<li style="border-left-color:#e53e3e;">⚠️ 查詢失敗（請檢查 GAS 部署權限設定）</li>`;
          continue;
        }

        // A 欄時間戳記排序（最新填寫覆蓋舊的）
        data.sort((a, b) => {
          const tA = new Date(Object.values(a)[0] || 0).getTime();
          const tB = new Date(Object.values(b)[0] || 0).getTime();
          return tA - tB;
        });

        // 記錄家庭編號是否有填寫記錄: familyNum -> true
        const familySubmittedMap = {};
        const memberStatusMap = {};

        data.forEach(row => {
          const vals = Object.values(row);

          // C 欄：家庭編號 (Index 2)
          const familyNum = extractNum(vals[2]);
          if (familyNum) {
            familySubmittedMap[familyNum] = true;
          }

          // 對應欄位：
          // 炫蜂團：H,I 欄 (index 7, 8) 與 J,K 欄 (index 9, 10)
          // 小蟻團：L,M 欄 (index 11, 12) 與 N,O 欄 (index 13, 14)
          let colPairs = [];
          if (grp === '炫蜂團') colPairs = [[7, 8], [9, 10]];
          if (grp === '小蟻團') colPairs = [[11, 12], [13, 14]];

          colPairs.forEach(([childColIdx, statusColIdx]) => {
            const rawChild = vals[childColIdx] || '';
            const rawStatus = String(vals[statusColIdx] || '');

            const childNum = extractNum(rawChild);
            const childName = cleanName(rawChild);

            if (!rawChild) return; // 完全沒填跳過

            // 🟢 新增驗證 2：孩子欄位填了「無此成員 / 不適用」
            if (rawChild.includes('無此成員') || rawChild.includes('不適用')) {
              // 如果這筆填單帶有家庭編號，我們記錄該家庭這欄選了無此成員
              if (familyNum) {
                memberStatusMap[`INVALID_FAMILY_${familyNum}_COL_${childColIdx}`] = true;
              }
              return;
            }

            if (!childName) return;

            // 🟢 驗證 1：C欄編號與孩子編號不符
            if (familyNum && childNum && familyNum !== childNum) {
              memberStatusMap[childName] = { type: 'ERROR', msg: '⚠️ 填單錯誤' };
              return;
            }

            // 🟢 驗證 3：有名字但出席欄選無此成員/不適用
            if (rawStatus.includes('無此成員') || rawStatus.includes('不適用')) {
              memberStatusMap[childName] = { type: 'ERROR', msg: '⚠️ 填單錯誤' };
              return;
            }

            // 🟢 正常出席 / 請假
            if (rawStatus.includes('出席')) {
              memberStatusMap[childName] = { type: 'PRESENT', msg: '✅ 出席' };
            } else if (rawStatus.includes('請假') || rawStatus.includes('不出席')) {
              memberStatusMap[childName] = { type: 'ABSENT', msg: '❌ 請假' };
            }
          });
        });

        // 輸出卡片
        for (const sub of allSubGroups) {
          const entries = subGroupObj[sub] || [];
          results.innerHTML += `<li class="team-header">🟢 <strong>${sub}</strong></li>`;

          entries.forEach(e => {
            const childName = (e.child || '').trim();
            const cleanChild = cleanName(childName);
            const familyNum = extractNum(e.family || '');
            let line = "";

            let matchedKey = Object.keys(memberStatusMap).find(k => k === cleanChild || k.includes(cleanChild) || cleanChild.includes(k));

            if (matchedKey && memberStatusMap[matchedKey].type) {
              const st = memberStatusMap[matchedKey];
              if (st.type === 'PRESENT') {
                line = `${e.family} _ ${childName}：<span class="status-present">${st.msg}</span>`;
              } else if (st.type === 'ABSENT') {
                line = `${e.family} _ ${childName}：<span class="status-absent">${st.msg}</span>`;
              } else if (st.type === 'ERROR') {
                line = `${e.family} _ ${childName}：<span class="status-error">${st.msg}</span>`;
              }
            } else {
              // 🟢 比對防呆：家長有提交表單，但該孩子欄位卻選了「無此成員 / 不適用」
              if (familyNum && familySubmittedMap[familyNum]) {
                line = `${e.family} _ ${childName}：<span class="status-error">⚠️ 填單錯誤</span>`;
              } else {
                line = `${e.family} _ ${childName}：<span class="status-unfilled">未填寫</span>`;
              }
            }
            results.innerHTML += `<li>${line}</li>`;
          });
        }
      }
    });
  </script>
</body>
</html>
