<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 南二團 各小隊出席狀況 🐜</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to bottom right, #f9f9f9, #e6f7ff);
      color: #333;
      padding: 40px 20px;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 30px;
      color: #3c6478;
    }
    .card {
      background-color: white;
      max-width: 500px;
      margin: 0 auto 20px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: left;
    }
    .card label {
      display: block;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .card select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }
    .card button {
      display: block;
      width: 100%;
      padding: 10px 0;
      margin-top: 10px;
      font-size: 1em;
      color: white;
      background-color: #47a7f5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .card button:hover {
      background-color: #358ac9;
    }
    ul#results { list-style: none; padding: 0; margin: 0; }
    ul#results li {
      padding: 8px;
      margin: 6px auto;
      max-width: 500px;
      border-radius: 8px;
      background-color: #f1f8ff;
      border-left: 6px solid #47a7f5;
      text-align: left;
      font-size: 1em;
    }
    .status-present { color: green; font-weight: bold; }
    .status-absent  { color: red; font-weight: bold; }
    .status-unfilled { color: gray; font-style: italic; }
  </style>
</head>
<body>
    <h1>
    <a href="index.html" style="text-decoration: none; color: inherit;">
      🐝 荒野保護協會親子團南二團 小隊出席狀況 🐜
    </a>
    </h1>
  <div class="card">
    <label for="groupSelect">團別</label>
    <select id="groupSelect">
      <option value="">--請選擇團別--</option>
      <option value="小蟻團">小蟻團</option>
      <option value="炫蜂團">炫蜂團</option>
      </select>
    <button id="searchBtn">搜尋</button>
  </div>
  <ul id="results"></ul>

  <script src="https://sowtnn02.github.io/home/team-data.js"></script>

  <script>
    // 🔴 2. 設定你的 GAS 網址 (萬用查詢器)
    const MY_PROXY_URL = "https://script.google.com/macros/s/AKfycbxmzTs-dGe8rlGjeaUJH44bravhTNccqFsfImSz_wV-bSniF-E1aOqZ6nyShvyVYAtFCQ/exec";

    // 🔴 3. 設定你的主資料庫 ID (已更新)
    const MASTER_DB_ID = "1rsQZORmQldGeco9YRNUn9jaO10ogvXpsVSqjk4Z8Ur0"; 

    // ✅ 團別對應 key (對應 team-data.js 裡的 key)
    const groupMap = { '小蟻團':'ant','炫蜂團':'bee','奔鹿團':'deer','翔鷹團':'eagle' };

    // ✅ 資料庫中的工作表名稱 (對應新表單的分頁)
    const sheetNameMap = {
      "小蟻團": '蜂蟻',
      "炫蜂團": '蜂蟻',
      "奔鹿團": '鹿',
      "翔鷹團": '鷹'
    };

    function toMyProxyUrl(originalUrl) {
      if (!originalUrl) return "";
      const match = originalUrl.match(/\/d\/(.*?)(\/|$)/);
      const targetId = match ? match[1] : "";
      if (!targetId) return "";
      return `${MY_PROXY_URL}?targetId=${targetId}&sheetName=${encodeURIComponent("表單回應 1")}`;
    }

    async function loadSheetsFromSheet(sheetName) {
      const url = `${MY_PROXY_URL}?targetId=${MASTER_DB_ID}&sheetName=${encodeURIComponent(sheetName)}`;
      try {
        const res = await fetch(url);
        const raw = await res.json();
        if (raw.error) {
           console.error("Master DB Error", raw);
           alert("無法讀取主資料表");
           return [];
        }

        // --- 🟢 新增：日期過濾邏輯 ---
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const validData = raw.filter(item => {
           // 1. 檢查上架日
           if (item.date) {
             const startDate = new Date(item.date);
             startDate.setHours(0, 0, 0, 0);
             if (startDate > today) return false; 
           }
           // 2. 檢查下架日
           if (item.expiryDate) {
             const endDate = new Date(item.expiryDate);
             endDate.setHours(0, 0, 0, 0);
             if (endDate < today) return false; 
           }
           return true;
        });

        return validData.map(item => ({
          name: `${item.month || ''} ${item.title || ''}`,
          url: toMyProxyUrl(item.response_url || item.form_url)
        }));
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    const groupSelect = document.getElementById('groupSelect');
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');

    searchBtn.addEventListener('click', async () => {
      results.innerHTML = '';
      
      if (typeof teamData === 'undefined') {
        alert("⚠️ 無法讀取名單資料，請檢查網路連線或 team-data.js 路徑。");
        return;
      }

      const grp = groupSelect.value.trim();
      if (!grp) return alert('請選擇團別');

      const key = groupMap[grp];
      const masterSheetName = sheetNameMap[grp];

      if (!masterSheetName) return alert('查無對應資料表來源');

      results.innerHTML = '<li style="text-align:center; color:#666;">⏳ 查詢中，請稍候...</li>';

      const allSubGroups = Object.keys(teamData[key]);
      const sheets = await loadSheetsFromSheet(masterSheetName);

      results.innerHTML = '';

      if (sheets.length === 0) {
        results.innerHTML = '<li>⚠️ 找不到任何表單紀錄，或是目前無開放的表單。</li>';
        return;
      }

      for (const sheet of sheets) {
        if (!sheet.url || sheet.url.includes("targetId=&")) continue;

        results.innerHTML += `
          <li style="
            background:#e0f0ff;
            padding:10px;
            border-radius:8px;
            font-weight:bold;
            color:#2a5d9f;
            margin-top:20px
          ">
            ${sheet.name}｜${grp}出席狀況：
          </li>`;

        for (const sub of allSubGroups) {
          const entries = teamData[key][sub];
          const statusMap = {};
          entries.forEach(e => {
            const k = `${e.family.trim()}|${e.child.trim()}`;
            statusMap[k] = { ...e, filled:false, submitted:false, status:'' };
          });

          let data;
          try {
            const resp = await fetch(sheet.url + '&t=' + Date.now(), { cache:'no-store' });
            data = await resp.json();
            if (data.error) throw new Error(data.error);
          } catch {
            results.innerHTML += `<li>${sub}：⚠️ 查詢失敗 (連線逾時或權限錯誤)</li>`;
            continue;
          }

          data.forEach(row => {
            const vals = Object.values(row);
            const fam = (vals[1] || '').trim();
            
            entries.forEach(e => {
              // 🟢 強化比對：自動去除多餘空格，避免家庭名稱格式微小差異導致比對失敗
              if (fam.replace(/\s+/g, '') !== e.family.trim().replace(/\s+/g, '')) return;

              for (let i = 0; i < 3; i++) {
                const child = (vals[2 + i*3] || '').trim();
                const squad = (vals[3 + i*3] || '').trim();
                const st = (vals[4 + i*3] || '').trim();
                
                if (squad === sub || squad === grp) {
                  const k = `${e.family.trim()}|${e.child.trim()}`;
                  statusMap[k] = { ...statusMap[k], filled:true, submitted:true, status:st };
                }
              }
            });
          });

          results.innerHTML += `<li style="background:#f9fbff;font-weight:bold;margin-top:10px;">🟢 ${sub}</li>`;
          entries.forEach(e => {
            const k = `${e.family.trim()}|${e.child.trim()}`;
            const s = statusMap[k];
            let line;
            if (s.filled) {
              // 🟢 升級狀態判斷：支援「填單錯誤」、「出席」與「請假」
              if (s.status.includes('填單錯誤')) {
                line = `${s.family} _ ${s.child}：<span style="color:#e67e22; font-weight:bold;">⚠️ 填單錯誤</span>`;
              } else if (s.status.includes('出席')) {
                line = `${s.family} _ ${s.child}：<span class="status-present">✅ 出席</span>`;
              } else {
                line = `${s.family} _ ${s.child}：<span class="status-absent">❌ 請假</span>`;
              }
            } else if (s.submitted) {
              line = `${s.family} _ ${s.child}：<span class="status-unfilled">⚠️ 有填表，但未填此小隊</span>`;
            } else {
              line = `${s.family} _ ${s.child}：<span class="status-unfilled">未填寫</span>`;
            }
            results.innerHTML += `<li>${line}</li>`;
          });
        }
      }
    });
  </script>
</body>
</html>
